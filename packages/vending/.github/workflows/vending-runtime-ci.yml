name: Autonomous Vending Runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - ".github/workflows/vending-runtime-ci.yml"
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/vending-runtime-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
