name: Standing Witness Autonomous Sentinel & Attestation Registry

on:
  schedule:
    # Autonomous loop: audits every 6 hours and commits verified attestations
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  standing-sentinel:
    name: Evaluate & Publish Decision Integrity Attestations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Sentinel & Generate Cryptographic Attestations
        run: node sentinel.mjs

      - name: Commit & Publish Verifiable Attestation Records
        run: |
          git config user.name "whp-sentinel[bot]"
          git config user.email "sentinel@wheelerhubbell.com"
          git add attestations/
          if git diff --staged --quiet; then
            echo "No changes in attestations to commit."
          else
            git commit -m "chore(sentinel): publish automated Decision Integrity attestations [skip ci]"
            git push origin main
          fi

      - name: Append to GitHub Step Summary
        run: |
          if [ -f attestations/LATEST_AUDIT.md ]; then
            cat attestations/LATEST_AUDIT.md >> $GITHUB_STEP_SUMMARY
          fi
