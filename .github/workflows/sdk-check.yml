name: Public SDK build and boundary checks
on:
  push:
    paths: ['sdk/**', '.github/workflows/sdk-check.yml', '*verifier*', '*.py']
  pull_request:
    paths: ['sdk/**', '.github/workflows/sdk-check.yml', '*verifier*', '*.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enable bwrap namespaces on disposable CI runner
        # AppArmor admission is only for /usr/bin/bwrap. No global sysctl change.
        # SDK still requires --unshare-all and fails closed if sandboxing fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          sudo tee /etc/apparmor.d/whp-bwrap-ci >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile whp_bwrap_ci /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/whp-bwrap-ci
          bwrap --unshare-all --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev /usr/bin/true
      - run: python3 sdk/tools/boundary_check.py
      - run: |
          python3 -m venv /tmp/whp-verifier-runtime
          /tmp/whp-verifier-runtime/bin/pip install -r requirements.txt
          /tmp/whp-verifier-runtime/bin/pip install build hatchling 'eth-account>=0.13,<0.14'
      - run: npm ci --ignore-scripts && npm test && npm pack
        working-directory: sdk/typescript
        env:
          WHP_PUBLIC_CHECKOUT: ${{ github.workspace }}
          WHP_VERIFIER_RUNTIME: /tmp/whp-verifier-runtime
      - run: |
          PYTHONPATH=src /tmp/whp-verifier-runtime/bin/python -m unittest discover -s tests -v
          /tmp/whp-verifier-runtime/bin/python -m build
        working-directory: sdk/python
        env:
          WHP_PUBLIC_CHECKOUT: ${{ github.workspace }}
          WHP_VERIFIER_RUNTIME: /tmp/whp-verifier-runtime
      - run: python3 sdk/tools/inspect_artifacts.py
      # No publishing job, wallet key, payments or private repository checkout.
