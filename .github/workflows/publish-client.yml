name: Publish client to npm

# Publishes packages/client to npm through npm trusted publishing (OIDC).
# No stored token. Manual dispatch only. The package version must be one
# that is not yet on npm; the job fails otherwise.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install and test
        working-directory: packages/client
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Publish
        working-directory: packages/client
        run: npm publish --access public
