name: Publish client to npm

# Publishes packages/client to npm through npm trusted publishing (OIDC).
# No stored token. Manual dispatch, plus a push trigger on the 0.2.5 release branch so it can run before merge. The package version must be one
# that is not yet on npm; the job fails otherwise.

on:
  workflow_dispatch:
  push:
    branches: [client-0.2.5-current-payment-contract]
    paths: ['.github/workflows/publish-client.yml']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install and test
        working-directory: packages/client
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Publish
        working-directory: packages/client
        run: npm publish --access public
