[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whp-standing-client"
version = "0.1.0"
description = "Official client for WHP Standing: x402 (USDC on Base) payment handling with EIP-3009 signing; evaluate, get_contract, get_result, recover."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "cryptography>=42", "eth-account>=0.11"]
keywords = ["WHP Standing", "x402", "USDC", "Base", "EIP-3009"]
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "build", "twine"]

[project.urls]
Homepage = "https://github.com/wheelerhubbell/whp-standing-client"

[tool.hatch.build.targets.wheel]
packages = ["src/whp_standing_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
strict = true
